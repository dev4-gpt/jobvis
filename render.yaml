services:
  - type: web
    name: jobvis
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: GRADIO_SHARE
        value: "false"
      - key: OPIK_ENABLED
        value: "true"
